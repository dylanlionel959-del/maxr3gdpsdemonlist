<!DOCTYPE html>

        <!-- Bloqueo Regional de Prueba (Venezuela) con Error 403 en Inglés -->
        <script>
            fetch('https://ipapi.co')
                .then(response => response.json())
                .then(data => {
                    if (data.country_code === 'VE') {
                        // Sobrescribe el documento completo simulando un error de servidor nativo
                        document.documentElement.innerHTML = `
                            <head>
                                <title>403 Forbidden</title>
                                <style>
                                    body {
                                        background-color: #ffffff;
                                        color: #000000;
                                        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                                        margin: 40px;
                                    }
                                    h1 {
                                        font-size: 24px;
                                        font-weight: 500;
                                        margin-bottom: 8px;
                                    }
                                    p {
                                        font-size: 14px;
                                        margin-top: 0;
                                    }
                                    hr {
                                        border: 0;
                                        border-top: 1px solid #eeeeee;
                                        margin: 20px 0;
                                    }
                                    .footer {
                                        font-size: 13px;
                                        color: #555555;
                                        font-style: italic;
                                    }
                                </style>
                            </head>
                            <body>
                                <h1>403 Forbidden</h1>
                                <p>Access to this resource on the server is denied!</p>
                                <hr>
                                <div class="footer">Cloudflare Pages / Web Server Environment</div>
                            </body>
                        `;
                    }
                })
                .catch(err => console.error("Error verifying location:", err));
        </script>
